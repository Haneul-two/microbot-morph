<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>microbot-morph — 마이크로봇 형상 변환</title>
<meta name="description" content="수만 개의 입자가 형상 사이를 오가며 재조립되는 과정을 보여주는 3D 데모.">
<style>
  :root {
    --bg: #05070a;
    --panel: rgba(12, 16, 22, 0.72);
    --line: rgba(159, 182, 210, 0.16);
    --text: #dbe4f0;
    --muted: #7d8ca1;
    --hot: #ff7a33;
    --rim: #9fb6d2;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard Variable", Pretendard, -apple-system, "Segoe UI",
                 "Malgun Gothic", system-ui, sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  #gl {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
    cursor: crosshair;
  }

  .panel {
    position: fixed;
    top: 20px;
    left: 20px;
    width: 268px;
    max-height: calc(100vh - 40px);
    overflow-y: auto;
    padding: 18px 18px 16px;
    background: var(--panel);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--line);
    border-radius: 14px;
    font-size: 13px;
    line-height: 1.5;
  }

  .title {
    margin: 0 0 2px;
    font-size: 15px;
    font-weight: 650;
    letter-spacing: -0.01em;
  }

  .sub {
    margin: 0 0 16px;
    color: var(--muted);
    font-size: 11.5px;
    line-height: 1.45;
  }

  .label {
    margin: 0 0 7px;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: var(--muted);
    text-transform: uppercase;
  }

  .shapes {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin-bottom: 16px;
  }

  button {
    font: inherit;
    color: var(--text);
    background: rgba(159, 182, 210, 0.07);
    border: 1px solid transparent;
    border-radius: 8px;
    padding: 7px 8px;
    cursor: pointer;
    transition: background 0.14s, border-color 0.14s, color 0.14s;
    text-align: left;
    font-size: 12px;
  }

  button:hover { background: rgba(159, 182, 210, 0.14); }

  button.active {
    background: rgba(255, 122, 51, 0.16);
    border-color: rgba(255, 122, 51, 0.5);
    color: #ffd2b8;
  }

  /* 전이 중 눌린 형상. 현재 전이가 끝나면 이어서 실행된다. */
  button.queued {
    border-color: rgba(159, 182, 210, 0.45);
    color: var(--rim);
  }
  button.queued::after {
    content: " ·대기";
    font-size: 10px;
    color: var(--muted);
  }

  .modes {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin-bottom: 16px;
  }

  .scrub-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
  }

  #play {
    flex: 0 0 auto;
    width: 32px;
    text-align: center;
    padding: 6px 0;
  }

  input[type="range"] {
    flex: 1;
    -webkit-appearance: none;
    appearance: none;
    height: 3px;
    border-radius: 2px;
    background: rgba(159, 182, 210, 0.22);
    outline: none;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: var(--hot);
    cursor: grab;
    border: none;
  }

  input[type="range"]::-moz-range-thumb {
    width: 13px;
    height: 13px;
    border: none;
    border-radius: 50%;
    background: var(--hot);
    cursor: grab;
  }

  input[type="range"]:disabled { opacity: 0.35; }

  .scrub-meta {
    display: flex;
    justify-content: space-between;
    color: var(--muted);
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    margin-bottom: 14px;
  }

  .check {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-bottom: 14px;
    cursor: pointer;
    color: var(--text);
    font-size: 12px;
  }

  .check input { accent-color: var(--hot); margin: 0; }

  .stats {
    padding-top: 12px;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    display: flex;
    justify-content: space-between;
  }

  .hint {
    position: fixed;
    left: 50%;
    bottom: 18px;
    transform: translateX(-50%);
    color: var(--muted);
    font-size: 11.5px;
    letter-spacing: 0.01em;
    pointer-events: none;
    white-space: nowrap;
  }

  .hint b { color: var(--rim); font-weight: 500; }

  #fallback {
    position: fixed;
    inset: 0;
    display: none;
    place-items: center;
    padding: 32px;
    text-align: center;
    line-height: 1.7;
    color: var(--muted);
  }

  @media (max-width: 720px) {
    .panel {
      top: auto;
      bottom: 12px;
      left: 12px;
      right: 12px;
      width: auto;
      max-height: 46vh;
    }
    .hint { display: none; }
  }
</style>
</head>
<body>

<canvas id="gl"></canvas>

<div class="panel" id="panel">
  <h1 class="title">마이크로봇 형상 변환</h1>
  <p class="sub">입자 하나하나가 흩어졌다가 다음 형상의 제 자리를 찾아간다.</p>

  <p class="label">형상</p>
  <div class="shapes" id="shapes"></div>

  <p class="label">변형 방식</p>
  <div class="modes" id="modes"></div>

  <p class="label">진행률</p>
  <div class="scrub-row">
    <button id="play" title="재생 / 일시정지">▶</button>
    <input type="range" id="scrub" min="0" max="1000" value="1000">
  </div>
  <div class="scrub-meta">
    <span id="transitionLabel">—</span>
    <span id="percent">100%</span>
  </div>

  <label class="check">
    <input type="checkbox" id="autoTour" checked>
    자동 순회
  </label>

  <div class="stats">
    <span id="statCount">—</span>
    <span id="statFps">— fps</span>
  </div>
</div>

<div class="hint">
  <b>드래그</b> 회전 · <b>휠</b> 줌 · <b>커서</b>로 입자 밀어내기
</div>

<div id="fallback">
  이 브라우저는 WebGL2를 지원하지 않아 입자를 그릴 수 없습니다.<br>
  최신 Chrome, Edge, Firefox, Safari에서 열어 주세요.
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js"
  }
}
</script>
<script type="module" src="./src/main.js"></script>

</body>
</html>
